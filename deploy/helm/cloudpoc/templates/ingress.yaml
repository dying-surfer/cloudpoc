# Eingang von außen, übernimmt die Rolle des nginx-Proxys aus dem Compose-Stack:
#   /api/…, /healthz, /readyz  → backend   ·   alles andere → frontend
# Die Health-Endpoints müssen explizit ans Backend, sonst beantwortet sie der
# SPA-Fallback des Frontends mit index.html und 200.
# Prefix "/api" passt auf /api und /api/…, aber nicht auf /apifoo (ganze Pfadteile).
{{- $backend := printf "%s-backend" (include "cloudpoc.fullname" .) }}
{{- $frontend := printf "%s-frontend" (include "cloudpoc.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cloudpoc.fullname" . }}
  labels:
    {{- include "cloudpoc.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range list "/api" "/healthz" "/readyz" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backend }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontend }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
