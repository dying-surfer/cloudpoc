{{- if .Values.backend.autoscaling.enabled }}
# Skaliert das Backend nach CPU-Last zwischen minReplicas und maxReplicas.
# Grundlage: metrics-server (bei k3s dabei) und die CPU-requests der Pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cloudpoc.fullname" . }}-backend
  labels:
    {{- include "cloudpoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cloudpoc.fullname" . }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
