# Standardwerte des Charts. Pro Umgebung überschreibt eine eigene values-Datei
# (z. B. values-staging.yaml) oder --set nur das, was dort anders ist.

image:
  registry: ghcr.io/dying-surfer
  # Pflicht: voller Commit-SHA aus der CI (build once, deploy many), z. B.
  # --set image.tag=$(git rev-parse origin/main)
  tag: ""
  pullPolicy: IfNotPresent
  # Die Pakete in GHCR sind privat: Name eines Secrets vom Typ
  # kubernetes.io/dockerconfigjson im selben Namespace (Anlage: docs/k8s.md)
  pullSecret: ghcr-pull

frontend:
  replicas: 1
  # Wird als /config.json ausgeliefert (Runtime-Config der Angular-App)
  config:
    environment: staging
    banner: STAGING · k3s
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

ingress:
  # k3s bringt Traefik als Ingress-Controller mit
  className: traefik
  # Leer = jeder Hostname. Mehrere Umgebungen im selben Cluster brauchen
  # unterschiedliche Hosts, sonst kollidieren ihre Routen.
  host: ""

backend:
  replicas: 1
  # Secret im Namespace mit dem Schlüssel APP_SECRET (Anlage: docs/k8s.md)
  existingSecret: cloudpoc-backend
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

db:
  # cnpg:     Postgres-Cluster per CloudNativePG-Operator, im selben Namespace
  # external: fertige DB (z. B. Azure Flexible Server), DATABASE_URL aus einem Secret
  mode: cnpg
  cnpg:
    # Mehr als 1 erst bei mehreren Nodes sinnvoll (Standbys auf anderen Maschinen)
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:17
    size: 1Gi
  external:
    # Secret mit dem Schlüssel DATABASE_URL (Doctrine-Format inkl. serverVersion)
    existingSecret: ""
