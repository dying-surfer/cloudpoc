# Werte für den Namespace cloudpoc-staging (k3s-VM). Eine Datei pro Namespace, der Dateiname
# ist der Namespace: make k8s-deploy NS=cloudpoc-staging TAG=<SHA>
# Hier steht nur, was von cloudpoc/values.yaml abweicht oder zur Umgebung gehört.
# image.tag fehlt mit Absicht: Die Version kommt beim Deploy per TAG.

frontend:
  config:
    environment: staging
    banner: STAGING · k3s

db:
  cnpg:
    backup:
      enabled: true
      # RustFS im Cluster (deploy/k3s/rustfs.yaml), Zugang im Secret cloudpoc-s3
      bucket: cloudpoc-backups
      endpointURL: http://rustfs.rustfs.svc:9000
