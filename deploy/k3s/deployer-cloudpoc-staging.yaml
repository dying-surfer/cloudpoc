# Zugang für den Deploy-Runner: darf im Namespace cloudpoc-staging genau das, was
# make k8s-deploy braucht, und sonst nichts im Cluster (docs/k8s.md, Abschnitt 11).
# Anwenden mit der Admin-kubeconfig:
#   kubectl apply -f deploy/k3s/deployer-cloudpoc-staging.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: cloudpoc-staging
---
# Role = Rechte innerhalb eines Namespace (ClusterRole wäre clusterweit).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: cloudpoc-staging
rules:
  # Alles, was das Chart anlegt. Secrets: unsere per sops (kubectl apply) und die,
  # in denen Helm seine Releases speichert (sh.helm.release.v1.cloudpoc.v<N>).
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  # Backup (docs/k8s.md, Abschnitt 12): Zeitplan und Ziel der Backups legt das Chart an.
  # backups: von Hand ein Backup auslösen und nachsehen, was gelaufen ist.
  - apiGroups: [postgresql.cnpg.io]
    resources: [scheduledbackups, backups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch, create, update, patch, delete]
  # Nur lesen: helm --wait beobachtet, ob ReplicaSets und Pods bereit sind,
  # und zum Nachsehen nach einem Deploy (kubectl get pods, kubectl logs).
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: cloudpoc-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: cloudpoc-staging
---
# Token ohne Ablaufdatum für die kubeconfig des Runners. Die Datei enthält kein
# Geheimnis: Kubernetes trägt das Token ein, sobald das Secret existiert.
# Zurückziehen: dieses Secret löschen (und neu anlegen für ein neues Token).
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: cloudpoc-staging
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
