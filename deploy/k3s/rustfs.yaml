# S3-Speicher für die Postgres-Backups (docs/k8s.md, Abschnitt 12): RustFS als einzelner
# Pod mit Volume. Ersatz für einen echten Bucket bei einem Anbieter, nur zum Testen:
# Die Backups liegen damit auf derselben VM wie die Datenbank.
# Anwenden mit der Admin-kubeconfig. Der Namespace und das Secret müssen vorher da sein:
#   kubectl create namespace rustfs
#   make k8s-secrets NS=rustfs
#   kubectl apply -f deploy/k3s/rustfs.yaml
---
# Im Cluster erreichbar als http://rustfs.rustfs.svc:9000 (<service>.<namespace>.svc).
# Kein Ingress: Von außen kommt niemand an den Speicher.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
# StatefulSet statt Deployment: fester Pod-Name (rustfs-0) und ein eigenes Volume, das
# beim Neustart wieder an denselben Pod kommt. Nie zwei Pods gleichzeitig am Volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      # Das Image läuft als User rustfs (10001); fsGroup macht Volumes für ihn schreibbar
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            # Leer = Logs nach stdout (kubectl logs) statt in Dateien unter /logs
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
          # Root-Zugang: RUSTFS_ACCESS_KEY und RUSTFS_SECRET_KEY (deploy/secrets/rustfs/)
          envFrom:
            - secretRef:
                name: rustfs
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            # local-path setzt die Größe nicht durch, sie ist hier nur eine Angabe
            storage: 5Gi
---
# Legt den Bucket für die Backups an. Das Backup-Plugin erwartet ihn fertig: Die
# WAL-Archivierung scheitert sonst mit NoSuchBucket. Läuft einmal; ein erneutes
# kubectl apply lässt den abgeschlossenen Job in Ruhe. Weitere Buckets: von Hand
# in der Oberfläche oder als weiterer Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs
spec:
  # Startet der Job vor dem Server, versucht er es einfach erneut
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: aws
          # Die AWS-CLI als S3-Client: spricht mit jedem S3-kompatiblen Server
          image: amazon/aws-cli:2.37.9
          command: [sh, -c]
          args:
            - aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$BUCKET"
          env:
            - name: BUCKET
              value: cloudpoc-backups
            - name: AWS_ENDPOINT_URL
              value: http://rustfs:9000
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs
                  key: RUSTFS_SECRET_KEY
            # Die CLI will in ihr Home schreiben, der User 10001 hat keines
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
