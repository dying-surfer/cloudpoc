# nginx für die Angular-App (wird zu /etc/nginx/conf.d/default.conf).
# Die Datei landet im http-Block der Haupt-Config des Images.

# 12-Factor: Access-Log als JSON-Zeile (nach stdout, das macht das Image schon)
log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"user_agent":"$http_user_agent"}';

server {
    # IPv4 und IPv6. Ohne die zweite Zeile setzt der Container IPv6-Verbindungen
    # zurück, z. B. curl localhost (→ ::1) über die Port-Weiterleitung von rootless Podman (pasta).
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout json;
    # Keine nginx-Version in Headern und Fehlerseiten
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Dateien mit Hash im Namen (main-5LT5BAFU.js, media/roboto-…-LOX3CHMS.woff2) ändern
    # nie ihren Inhalt: Ein neuer Build erzeugt neue Namen. Der Browser darf sie also
    # ein Jahr lang cachen, ohne nachzufragen. Fehlt so eine Datei, ist das ein echter
    # 404 und nicht index.html.
    location ~ "-[A-Za-z0-9]{8}\.(js|css|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Alle anderen Dateien (config.json, favicon.ico, …): immer frisch holen, und ein
    # echter 404, wenn sie fehlen. Der SPA-Fallback unten ist nur für Routen gedacht;
    # Routen haben keine Dateiendung. Sonst bekäme z. B. ein falscher Skript-Pfad
    # index.html mit Status 200, und der Browser meldet nur einen MIME-Type-Fehler.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA-Fallback: /tickets/123 gibt es nicht als Datei. Dann liefert nginx
    # index.html aus, und der Angular-Router zeigt die richtige Seite.
    # no-cache: Nach einem Deploy holt der Browser die neue index.html (mit den
    # neuen Dateinamen) statt einer veralteten Kopie.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
