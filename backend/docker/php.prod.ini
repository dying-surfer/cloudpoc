; PHP-Einstellungen für das Prod-Image (ergänzen php.ini-production)

; Keine PHP-Version im Header "X-Powered-By" verraten
expose_php = Off

; Opcache: kompilierten Bytecode im Speicher halten.
; validate_timestamps=0: Dateien werden nie auf Änderungen geprüft. Das ist sicher,
; weil sich der Code im Image nicht ändert; neuer Code kommt nur mit einem neuen Image.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Pfadauflösungen cachen (Symfony lädt viele Dateien)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
