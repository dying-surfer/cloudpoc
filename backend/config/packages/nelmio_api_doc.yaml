nelmio_api_doc:
    documentation:
        info:
            title: cloudpoc Ticket API
            description: Ticket CRUD API. Errors are returned as Problem Details (RFC 9457).
            version: 1.0.0
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc) # Routes under /api, except the docs themselves
            - ^/(healthz|readyz)$
