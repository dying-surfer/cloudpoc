when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true
        faker:
            locale: de_DE
            # Fixed seed: every load produces the same tickets (dates relative to today).
            seed: 1234

when@test:
    zenstruck_foundry:
        persistence:
            flush_once: true
        faker:
            locale: de_DE
            seed: 1234
        orm:
            reset:
                # Build the test DB by running the real migrations (not from the mapping),
                # so the tests also prove that the migrations are complete.
                mode: migrate
