# Regeln für sops (Secrets verschlüsselt im Repo, Anleitung: docs/k8s.md).
# sops sucht diese Datei vom aktuellen Verzeichnis aufwärts, also im Repo aufrufen.
# Hier stehen nur öffentliche age-Schlüssel: Mit ihnen lässt sich verschlüsseln,
# entschlüsseln nur mit einem der privaten Schlüssel (liegen nicht im Repo).
creation_rules:
  # Kubernetes-Secrets für cloudpoc-staging. Verschlüsselt werden nur die Werte unter
  # data/stringData, Name und Namespace bleiben lesbar (sichtbar im Diff).
  # Weitere Umgebungen bekommen eine eigene Regel (ggf. eigener Schlüssel).
  - path_regex: deploy/secrets/cloudpoc-staging/.*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    # Empfänger, mit Komma getrennt in einer Zeile: jeder der privaten Schlüssel öffnet die Dateien.
    #   1. User (Host, ~/.config/sops/age/keys.txt)
    #   2. Deploy-Runner in der k3s-VM (User runner, nur dort)
    # Nach einer Änderung hier: sops updatekeys für jede Datei (docs/k8s.md, Abschnitt 11).
    age: age14d8ta7ch7n4jnx096fnvlmvqmvvzzaty7sf6vmrlcyq25h8439fs5328xk,age1wau5d4yyqjxhxlx3w6d0ygr5trfgww4z2p72n560l9tdyvmgscwq0h8q95
