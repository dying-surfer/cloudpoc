# Deploy: Rollt auf Knopfdruck eine beliebige Version auf die VM aus, über den
# Self-hosted Runner dort (Einrichtung: docs/vm.md). Die VM ist eine lokale Spielwiese,
# darum manuell statt automatisch nach jeder CI: Actions → Deploy → Run workflow.
#
# Version = Commit-SHA, Branch oder Tag. Ausgerollt werden die Images mit dem Commit-SHA
# als Tag (build once, deploy many). Die gibt es für jeden Commit, den die CI per Push
# auf main gebaut hat.
#
# Absicherung (öffentliches Repo): workflow_dispatch dürfen nur User mit Schreibrecht
# auslösen, PRs aus Forks nicht.
name: Deploy
run-name: Deploy ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version (voller Commit-SHA, Branch oder Tag)
        required: true
        default: main

# Deploys nacheinander, nie abbrechen (ein halber Deploy ist schlimmer als ein später)
concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy auf die VM
    runs-on: [self-hosted, vm]
    timeout-minutes: 15
    env:
      CONTAINER: docker
      ENV_FILE: /srv/cloudpoc/.env
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Branch oder Tag auf den Commit-SHA auflösen, der ist der Image-Tag
      - name: Images bestimmen
        run: |
          sha=$(git rev-parse HEAD)
          echo "BACKEND_IMAGE=$REGISTRY/cloudpoc-backend:$sha" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$REGISTRY/cloudpoc-frontend:$sha" >> "$GITHUB_ENV"
          echo "Version: $sha ($(git log -1 --format=%s))" >> "$GITHUB_STEP_SUMMARY"
      # Die Pakete in GHCR sind privat. Das Token gilt nur für diesen Lauf,
      # die Action meldet sich am Ende wieder ab.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Vorab prüfen, damit ein fehlendes Image nicht erst mitten im Deploy auffällt
      - name: Images vorhanden?
        run: |
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker manifest inspect "$image" > /dev/null || {
              echo "::error::$image fehlt in GHCR. Nur Commits, die die CI auf main gebaut hat, haben Images."
              exit 1
            }
          done
      - run: make deploy
      # Der Port kommt aus HTTP_PORT in der .env der VM (docs/vm.md: 8080)
      - name: Readiness prüfen
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/readyz
      - if: always()
        run: make stack-ps
